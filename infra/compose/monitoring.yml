# ============================================================
# 智购 · 可观测性编排（Prometheus + Grafana + Loki + Promtail）
#
# 启动: docker compose -f infra/compose/monitoring.yml up -d
# 停止: docker compose -f infra/compose/monitoring.yml down
# ============================================================

services:
  # ==================== Prometheus ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: zhigou-prometheus
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "9090:9090"
    volumes:
      - ../../conf/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../conf/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # ==================== Grafana ====================
  grafana:
    image: grafana/grafana:latest
    container_name: zhigou-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ../../conf/grafana/datasources:/etc/grafana/provisioning/datasources
      - ../../conf/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-data:/var/lib/grafana

  # ==================== Alertmanager ====================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: zhigou-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ../../conf/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

  # ==================== Loki ====================
  loki:
    image: grafana/loki:2.9.10
    container_name: zhigou-loki
    user: root
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ../../conf/loki/config.yml:/etc/loki/config.yml
      - loki-data:/loki
    command:
      - '-config.file=/etc/loki/config.yml'

# ==================== 卷 ====================
volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data: