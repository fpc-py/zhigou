# 智购 Alertmanager 告警路由
# 入口：Prometheus alerting 配置指向 alertmanager:9093
# 通道示例：webhook（钉钉/飞书/企业微信），替换 URL 即生效
route:
  group_by: ['alertname', 'application']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-webhook'
  routes:
    - matchers:
        - severity = "critical"
      receiver: 'critical-webhook'
      continue: true

receivers:
  - name: 'default-webhook'
    webhook_configs:
      - url: 'http://host.docker.internal:18080/alert/webhook'   # 占位：替换为实际告警通道
        send_resolved: true
  - name: 'critical-webhook'
    webhook_configs:
      - url: 'http://host.docker.internal:18080/alert/critical'  # 占位：critical 通道（钉钉/飞书群机器人）
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['application']
