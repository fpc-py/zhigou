# ============================================================
# 智购 · CI 流水线（build → test → 镜像 → 推送）
# 触发：push main / PR / 手动
# 镜像：GHCR（ghcr.io/fpc-py/zhigou/<svc>:<tag>）
#   · push main        -> <svc>:main-<sha7> + <svc>:latest
#   · tag v*           -> <svc>:<tag> + <svc>:latest
#   · pull_request     -> 仅构建验证不推送
# 部署：见 deploy.yml（手动触发，SSH + docker compose）
# ============================================================
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Job 1：编译 + 单测 ----------
  build-test:
    name: Build & Test (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # MinIO 集成测试镜像：Docker Hub 固定 RELEASE tag（latest 已停维护 / quay 匿名受限）；
      # 需要换源（内网/私有/GHCR）时仅改此变量，无需动测试代码
      MINIO_IMAGE: minio/minio:RELEASE.2024-11-07T00-52-20Z
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build & test (all modules)
        run: mvn -B -ntp clean verify

      - name: Upload surefire reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/
          retention-days: 7

  # ---------- Job 2：构建并推送镜像（GHCR）----------
  build-images:
    name: Build & push images (GHCR)
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ghcr.io/fpc-py/zhigou
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-center
          - user-service
          - file-service
          - product-service
          - cart-service
          - order-service
          - inventory-service
          - payment-service
          - marketing-service
          - logistics-service
          - aftersale-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像 tag 策略：main=main-<sha7>+latest；tag=v*= 直接版本+latest；PR=仅构建
      - name: Compute image tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "tags=${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.ref_name }},${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "tags=${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:main-${GITHUB_SHA::7},${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest" >> "$GITHUB_OUTPUT"
          fi

      # 多阶段构建：Stage1 在 CI（有网络）完成容器内 mvn 打包，
      # 补齐本地 Docker Desktop 容器网络无法下载 Maven 依赖的验证缺口
      - name: Build image (multi-stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ steps.tags.outputs.push }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- Job 3：部署状态汇总 ----------
  summary:
    name: Pipeline summary
    needs: [build-test, build-images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        run: |
          echo "## CI Pipeline Result" >> $GITHUB_STEP_SUMMARY
          echo "- Build & Test: ${{ needs.build-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Images (11 services): ${{ needs.build-images.result }}" >> $GITHUB_STEP_SUMMARY
          echo "> 部署请手动触发 deploy.yml（SSH + docker compose pull && up）" >> $GITHUB_STEP_SUMMARY
