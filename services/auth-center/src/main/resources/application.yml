server:
  port: 8080

spring:
  application:
    name: auth-center

  datasource:
    url: jdbc:mysql://localhost:3307/zhigou?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true

jwt:
  secret: ${JWT_SECRET:change-me-to-a-random-256-bit-string}
  access-expire-seconds: ${JWT_ACCESS_EXPIRE_SECONDS:7200}
  refresh-expire-seconds: ${JWT_REFRESH_EXPIRE_SECONDS:1209600}
# ==================== Actuator / Prometheus ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
