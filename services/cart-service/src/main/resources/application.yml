server.port: ${SERVER_PORT:8084}
spring:
  application.name: cart-service
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
springdoc.swagger-ui.path: /swagger-ui.html
knife4j.enable: true
jwt.secret: ${JWT_SECRET:change-me-to-a-random-256-bit-string}
product-service.url: ${PRODUCT_SERVICE_URL:http://localhost:8083}
# ==================== Actuator / Prometheus ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET:change-me-to-a-random-256-bit-string}
# ==================== Resilience4j 服务间熔断（工作流3 #7） ====================
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2000ms
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      cartValidateSku:
        base-config: default