server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: product-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/zhigou_product?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # P0-D4 压测瓶颈优化：默认连接池 10 在高并发下耗尽，调大至 50
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 3000
      pool-name: ProductHikariPool
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_product_history
    baseline-on-migrate: true
    validate-on-migrate: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

# 商品分页缓存 TTL（秒）：300s 内压测/热点商品列表直接命中，降低高并发下 DB 回填频率
product:
  cache:
    ttl-seconds: 300

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc.swagger-ui.path: /swagger-ui.html
knife4j.enable: true

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: product-producer-group

jwt:
  secret: ${JWT_SECRET:change-me-to-a-random-256-bit-string}
# ==================== Actuator / Prometheus ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
