spring:
  config:
    activate:
      on-profile: dev
  flyway:
    # dev profile 追加 mock 数据目录（DDL + mock）
    # 上线时不激活 dev profile，仅执行 db/migration（纯 DDL）
    locations: classpath:db/migration,classpath:db/mock

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId}] [%thread] %logger{36} - %msg%n"
  level:
    com.zhigou: DEBUG
