server.port: ${SERVER_PORT:8085}
spring:
  application.name: order-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/zhigou_order?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 3000
      pool-name: ZhigouHikariPool
    driver-class-name: com.mysql.cj.jdbc.Driver
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_order_history
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
mybatis-plus.global-config.db-config:
  logic-delete-field: deleted
  logic-delete-value: 1
  logic-not-delete-value: 0
springdoc.swagger-ui.path: /swagger-ui.html
knife4j.enable: true
jwt.secret: ${JWT_SECRET:change-me}
zhigou.crypto.key: ${ZHIGOU_CRYPTO_KEY:zhigou-local-key-2026-1021}
product-service:
  url: ${PRODUCT_SERVICE_URL:http://localhost:8083}
inventory-service:
  url: ${INVENTORY_SERVICE_URL:http://localhost:8086}
marketing-service:
  url: ${MARKETING_SERVICE_URL:http://localhost:8088}
order:
  timeout-close-minutes: ${ORDER_TIMEOUT_CLOSE_MINUTES:15}
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer.group: order-producer-group
  consumer.group: order-consumer-group
# ==================== Actuator / Prometheus ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET:change-me-to-a-random-256-bit-string}
# ==================== Resilience4j 服务间熔断（工作流3 #7） ====================
# 编程式熔断（ResilientHttp）：滑动窗口 10 次、失败率阈值 50%、慢调用 2s 占比 50% 触发熔断；
# 打开 10s 后自动转半开放 3 个探活请求，成功则关闭恢复。参数化便于压测/线上调优。
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2000ms
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      orderFetchSku:
        base-config: default
      orderReleaseInventory:
        base-config: default