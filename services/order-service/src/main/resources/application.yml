server.port: ${SERVER_PORT:8085}
spring:
  application.name: order-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/zhigou?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true
mybatis-plus.global-config.db-config:
  logic-delete-field: deleted
  logic-delete-value: 1
  logic-not-delete-value: 0
springdoc.swagger-ui.path: /swagger-ui.html
knife4j.enable: true
jwt.secret: ${JWT_SECRET:change-me}
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer.group: order-producer-group
  consumer.group: order-consumer-group