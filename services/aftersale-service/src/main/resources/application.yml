server.port: ${SERVER_PORT:8090}
spring:
  application.name: aftersale-service
  cloud.openfeign.client.config.default:
    connectTimeout: 500
    readTimeout: 3000
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/zhigou_aftersale?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 3000
      pool-name: ZhigouHikariPool
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_aftersale_history
    baseline-on-migrate: true
    validate-on-migrate: false
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
order-service.url: ${ORDER_SERVICE_URL:http://localhost:8085}
payment-service.url: ${PAYMENT_SERVICE_URL:http://localhost:8087}
inventory-service.url: ${INVENTORY_SERVICE_URL:http://localhost:8086}
# ==================== Actuator / Prometheus ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET:change-me-to-a-random-256-bit-string}