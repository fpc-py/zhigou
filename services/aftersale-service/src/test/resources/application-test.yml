spring:
  config.activate.on-profile: test
  cloud.openfeign.client.config.default:
    connectTimeout: 300
    readTimeout: 300
  datasource:
    url: ${TEST_JDBC_URL}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: test
    password: test
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true
  autoconfigure:
    exclude: org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration
order-service.url: http://localhost:9999