spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: ${TEST_JDBC_URL}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: test
    password: test
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${spring.data.redis.host}
      port: ${spring.data.redis.port}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true

jwt:
  secret: test-jwt-secret-for-file-service!!

minio:
  bucket: test-bucket

file:
  url-expire-seconds: 600