server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: file-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/zhigou_file?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 3000
      pool-name: ZhigouHikariPool
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true

jwt:
  secret: ${JWT_SECRET:change-me-to-a-random-256-bit-string}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:admin123}
  bucket: ${MINIO_BUCKET:zhigou-media}

file:
  url-expire-seconds: ${FILE_URL_EXPIRE_SECONDS:3600}
  max-size-mb: ${FILE_MAX_SIZE_MB:5}
  image:
    # 图片处理：等比缩放上限（只缩小不放大）
    max-width: ${FILE_IMAGE_MAX_WIDTH:1280}
    max-height: ${FILE_IMAGE_MAX_HEIGHT:1280}
    # JPEG 压缩质量（0~1）
    quality: ${FILE_IMAGE_QUALITY:0.8}
    # 像素上限（宽×高），超限拒绝上传（防超大图内存 DoS）
    max-pixels: ${FILE_IMAGE_MAX_PIXELS:25000000}
# ==================== Actuator / Prometheus ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
